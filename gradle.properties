org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# SDK 发布坐标（见根 build.gradle.kts）。发版只改 IMRTC_VERSION，
# 并同步 call-engine 的 IMCallEngineVersion.VERSION——两者不等时 SdkVersionTest 会红。
# group 是 JitPack 多模块仓的固定写法 com.github.<GitHub 用户>.<仓名>，本地 mavenLocal 也用它，
# 这样 Demo 本地验的 POM 与第三方从 JitPack 拿到的是同一份。
IMRTC_GROUP=com.github.BLiYing.im-rtc-android
IMRTC_VERSION=2.0.0
